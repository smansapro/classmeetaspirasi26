<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aspirasi Class Meet · SMAN 1 Pronojiwo</title>
<style>
:root{--b:#1d4ed8;--bd:#14338f;--y:#facc15;--g:#16a34a;--r:#dc2626;--w:#fff;--bg:#f3f6ff;--ink:#11193a;--mut:#5b6486;--line:#d9e0f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.stripe{height:8px;background:linear-gradient(90deg,var(--b) 25%,var(--y) 25% 50%,var(--g) 50% 75%,var(--r) 75%)}
.hero{background:var(--b);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 64px;position:relative;overflow:hidden;text-align:center}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.9}
.hero:before{width:180px;height:180px;background:var(--y);right:-60px;top:-50px}
.hero:after{width:120px;height:120px;background:var(--r);left:-40px;bottom:-30px}
.hero>*{position:relative;z-index:1}
.logo{height:118px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 5px 0 var(--bd))}
.hero h1{margin:14px 0 4px;font-size:2.1rem;line-height:1.05;letter-spacing:-.5px;font-weight:900}
.hero h1 span{color:var(--y)}
.hero p{margin:0;opacity:.95;font-size:.98rem}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:34px;background:var(--bg);border-radius:34px 34px 0 0;z-index:2}
main{max-width:620px;margin:0 auto;padding:0 16px}
.intro{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px 16px;margin:-14px 0 18px;box-shadow:4px 4px 0 var(--ink);position:relative;z-index:3}
.intro b{color:var(--b)}
h2{font-size:1.2rem;margin:22px 0 10px}
.field{display:block;margin-bottom:12px}
.field span{font-weight:700;font-size:.9rem}
input[type=text],select{width:100%;font:inherit;font-size:1rem;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin-top:4px;min-height:52px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-color:var(--b)}
.bad{border-color:var(--r)!important}
.err{color:var(--r);font-size:.86rem;margin:4px 2px 0;font-weight:700}
.card{position:relative;background:#fff;border:2px solid var(--line);border-left:10px solid var(--c);border-radius:18px;margin-bottom:12px;overflow:hidden;transition:transform .12s,box-shadow .12s}
.card.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:4px 4px 0 var(--c)}
.card:active{transform:scale(.985)}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:0;padding:14px 12px 14px 10px;min-height:68px;cursor:pointer;color:var(--ink)}
.ic{font-size:1.9rem;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,#fff);flex:none}
.nm{font-weight:800;font-size:1.02rem;flex:1}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.card.on .ck{background:var(--c);border-color:var(--c)}
.card.on .ck:after{content:"✓"}
details{border-top:1px dashed var(--line)}
summary{padding:10px 14px;font-size:.88rem;color:var(--mut);cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"＋ "}
details[open] summary:before{content:"－ "}
details p{margin:0;padding:0 14px 14px;font-size:.92rem;color:#2a3358}
.extra{background:#fffbe6;border:2px dashed var(--y);border-radius:16px;padding:12px;margin-bottom:10px;animation:pop .25s}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.extra label{font-weight:800;font-size:.9rem}
.sug{background:#fff;border:2px solid var(--y);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:.88rem;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bar>div{max-width:620px;margin:0 auto}
.prog{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem;margin-bottom:6px}
.track{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--g));transition:width .25s;border-radius:99px}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:1.05rem;border:2px solid var(--ink);border-radius:16px;padding:14px;margin-top:10px;background:var(--y);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:54px}
.btn:disabled{background:#e4e8f5;color:#8a93b4;border-color:#b8c0dc;box-shadow:none;cursor:not-allowed}
.btn.sec{background:#fff;box-shadow:0 3px 0 var(--ink);margin-top:8px}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;display:none;max-width:588px;margin:0 auto}
.panel{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.ticket{background:#fff;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--g);margin:-10px 0 16px;position:relative;z-index:3}
.ticket .top{background:var(--g);color:#fff;padding:14px 16px}
.ticket .top small{opacity:.9}
.ticket .code{font-size:2.2rem;font-weight:900;letter-spacing:4px;font-family:ui-monospace,Menlo,monospace}
.ticket ol{margin:0;padding:12px 16px 14px 36px;font-size:.93rem}
.ticket ol li.add{color:var(--b);font-weight:700}
.ticket .who{padding:12px 16px;border-bottom:2px dashed var(--line);font-weight:800}
.conf{position:fixed;top:-20px;font-size:1.5rem;z-index:60;animation:fall 2.4s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.spin{display:inline-block;width:22px;height:22px;border:4px solid var(--line);border-top-color:var(--b);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem}
.row .lb{flex:0 0 42%;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row .tr{flex:1;height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--b);border-radius:99px}
.row .tr i.x{background:var(--g)}
.row .n{flex:0 0 auto;min-width:64px;text-align:right;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:2px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.85rem;font-weight:700}
.chip.ok{background:#dcfce7;border-color:var(--g)}
.chip.no{background:#fee2e2;border-color:var(--r)}
.tag{font-size:.72rem;background:var(--g);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
const clean=s=>String(s||"").replace(/^[\s=+\-@\t\r]+/,"").replace(/\s+/g," ").trim().slice(0,80);
const key=s=>norm(s).replace(/[^a-z0-9 ]/g,"").replace(/\blomba\b/g,"").replace(/\s+/g," ").trim();

/* ===== penyimpanan: localStorage + IndexedDB ===== */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("acm",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function idbSet(k,v){try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function store(k,v){lsSet(k,v);await idbSet(k,v)}
async function load(k){return lsGet(k)||await idbGet(k)||null}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
async function deviceId(){
  let id=await load("acm_dev");
  if(!id){id=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,12)}
  await store("acm_dev",id);
  const fp=hash([screen.width,screen.height,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.language].join("|"));
  return id+"."+fp;
}
function newTicket(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let t="";for(let i=0;i<4;i++)t+=a[Math.floor(Math.random()*a.length)];return "AC-"+t}
function toast(m,ms=3200){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",ms)}

const hero=(sub)=>`<header class="hero"><img class="logo" src="${LOGO}" alt="Logo SMA Negeri 1 Pronojiwo"><h1>Aspirasi <span>Class&nbsp;Meet</span></h1><p>SMA Negeri 1 Pronojiwo</p><p style="margin-top:6px;font-weight:700">${sub}</p><div class="wave"></div></header>`;

/* ===== state formulir ===== */
let S={nama:"",kelas:"",picked:new Set(),extras:Array(TOTAL).fill(""),touched:{},busy:false};

function extraError(i,n){
  const v=clean(S.extras[i]);const k=key(v);
  if(!v)return S.touched[i]?"Lomba tambahan ini wajib diisi.":"";
  if(v.length<3)return "Nama lomba terlalu pendek.";
  if(BAD.test(v))return "Gunakan bahasa yang sopan ya.";
  const bi=BASEKEYS.indexOf(k);
  if(bi>=0)return {sug:LOMBA[bi][0]};
  for(let j=0;j<n;j++)if(j!==i&&key(S.extras[j])===k)return "Lomba ini sama dengan tambahanmu yang lain.";
  return "";
}
function validState(){
  const n=TOTAL-S.picked.size;
  if(clean(S.nama).length<3||!S.kelas)return false;
  for(let i=0;i<n;i++){if(extraError(i,n)||!clean(S.extras[i]))return false}
  return true;
}

function viewForm(){
  $("#app").innerHTML=hero("Suaramu menentukan lomba class meet! 🎉")+`<main>
  <div class="intro">Usulkan <b>11 lomba</b> yang paling kamu mau. Pilih dari kartu di bawah, sisanya <b>tambah sendiri</b>. Contoh: pilih 5 kartu → tambah 6 lomba.</div>
  <h2>👋 Kenalan dulu</h2>
  <label class="field"><span>Nama lengkap</span><input id="nama" type="text" autocomplete="name" maxlength="60" placeholder="Contoh: Siti Aisyah" value="${esc(S.nama)}"></label>
  <label class="field"><span>Kelas</span><select id="kelas"><option value="">Pilih kelasmu…</option>${KELAS.map(k=>`<option ${S.kelas===k?"selected":""}>${k}</option>`).join("")}</select></label>
  <h2>🏆 Pilih lomba usulan <small style="color:var(--mut);font-weight:400">(boleh 0–11)</small></h2>
  <div id="cards"></div>
  <h2 id="xh"></h2>
  <div id="extras"></div>
  </main>
  <div class="bar"><div><div class="prog"><span id="pt"></span><span id="pp"></span></div><div class="track"><div class="fill" id="pf"></div></div><button class="btn" id="send" disabled>Kirim Aspirasiku</button></div></div>`;
  $("#cards").innerHTML=LOMBA.map((l,i)=>`<div class="card" style="--c:${COL[i%4]}" data-i="${i}"><button class="pick" aria-pressed="false"><span class="ic">${l[1]}</span><span class="nm">${esc(l[0])}</span><span class="ck"></span></button><details><summary>Lihat aturan singkat</summary><p>${esc(l[2])}</p></details></div>`).join("");
  $("#cards").addEventListener("click",e=>{const b=e.target.closest(".pick");if(!b)return;const i=+b.parentNode.dataset.i;S.picked.has(i)?S.picked.delete(i):S.picked.add(i);refresh()});
  $("#nama").oninput=e=>{S.nama=e.target.value;sync()};
  $("#kelas").onchange=e=>{S.kelas=e.target.value;sync()};
  $("#send").onclick=submit;
  refresh();
}

function refresh(){
  document.querySelectorAll(".card").forEach(c=>{const on=S.picked.has(+c.dataset.i);c.classList.toggle("on",on);c.querySelector(".pick").setAttribute("aria-pressed",on)});
  const n=TOTAL-S.picked.size;
  $("#xh").innerHTML=n>0?`✍️ Tambah Lomba <small style="color:var(--mut);font-weight:400">(${n} lagi, usulan bebas dari kamu)</small>`:"✅ Pas 11! Tidak perlu tambah lomba";
  const box=$("#extras");let h="";
  for(let i=0;i<n;i++)h+=`<div class="extra"><label for="x${i}">Tambah Lomba ${i+1}</label><input id="x${i}" type="text" maxlength="80" data-i="${i}" placeholder="Misal: Tarik Tambang" value="${esc(S.extras[i])}"><div class="msg" id="m${i}"></div></div>`;
  box.innerHTML=h;
  box.querySelectorAll("input").forEach(inp=>{inp.oninput=e=>{S.extras[+inp.dataset.i]=inp.value;sync()};inp.onblur=()=>{S.touched[+inp.dataset.i]=1;sync()}});
  sync();
}
function sync(){
  const n=TOTAL-S.picked.size;let filled=0;
  for(let i=0;i<n;i++){
    const e=extraError(i,n);const inp=$("#x"+i),m=$("#m"+i);if(!inp)continue;
    if(clean(S.extras[i])&&!e)filled++;
    inp.classList.toggle("bad",!!e);
    m.innerHTML=!e?"":typeof e==="object"?`<div class="sug">💡 Lomba ini sudah ada, pilih saja kartunya: <u>${esc(e.sug)}</u></div>`:`<div class="err">${e}</div>`;
  }
  const tot=S.picked.size+filled;
  $("#pt").textContent=`Terkumpul ${tot} dari ${TOTAL} lomba`;$("#pp").textContent=Math.round(tot/TOTAL*100)+"%";
  $("#pf").style.width=tot/TOTAL*100+"%";
  const ok=validState()&&!S.busy;$("#send").disabled=!ok;
  $("#send").textContent=S.busy?"Mengirim…":ok?"Kirim Aspirasiku 🚀":(clean(S.nama).length<3||!S.kelas)?"Isi nama & kelas dulu":"Lengkapi dulu ya";
}

/* ===== kirim + antrean offline ===== */
async function post(payload){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  return r.json();
}
async function submit(){
  if(!validState())return;
  if(API_URL.startsWith("GANTI")){toast("URL server belum diisi (lihat README).");return}
  S.busy=true;sync();
  const n=TOTAL-S.picked.size;
  const payload={nama:clean(S.nama),kelas:S.kelas,pilihan:[...S.picked].sort((a,b)=>a-b).map(i=>LOMBA[i][0]),tambahan:S.extras.slice(0,n).map(clean),deviceId:await deviceId(),ticket:newTicket()};
  let rec={nama:payload.nama,kelas:payload.kelas,ticket:payload.ticket,list:[...payload.pilihan,...payload.tambahan],nb:payload.pilihan.length,pending:false};
  try{
    const r=await post(payload);
    if(r.ok){rec.ticket=r.ticket}
    else if(r.dup){rec.ticket=r.ticket;rec.dup=true;await store("acm_done",JSON.stringify(rec));S.busy=false;return viewDone(rec,true)}
    else{S.busy=false;sync();toast(r.err||"Gagal mengirim. Coba lagi ya.");return}
  }catch(e){
    if(e instanceof SyntaxError){S.busy=false;sync();toast("Server belum bisa dipakai. Panitia: cek deploy Apps Script (akses harus Anyone) dan URL /exec.",7000);return}
    rec.pending=true;await store("acm_queue",JSON.stringify(payload));
  }
  await store("acm_done",JSON.stringify(rec));S.busy=false;viewSuccess(rec);
}
async function flushQueue(){
  const q=await load("acm_queue");if(!q||API_URL.startsWith("GANTI"))return;
  try{
    const r=await post(JSON.parse(q));
    if(r.ok||r.dup){await store("acm_queue","");const d=JSON.parse(await load("acm_done")||"{}");d.pending=false;if(r.ticket)d.ticket=r.ticket;await store("acm_done",JSON.stringify(d));toast("Aspirasimu yang tertunda sudah terkirim ✅");if(!$("#tk"))return;viewSuccess(d)}
  }catch(e){}
}
addEventListener("online",flushQueue);

/* ===== layar sukses & sudah mengisi ===== */
function ticketHTML(r){
  return `<div class="ticket" id="tk"><div class="top"><small>Kode tiket</small><div class="code">${esc(r.ticket)}</div></div><div class="who">${esc(r.nama)} · ${esc(r.kelas)}</div><ol>${r.list.map((x,i)=>`<li class="${i>=r.nb?"add":""}">${esc(x)}${i>=r.nb?'<span class="tag">usulanku</span>':""}</li>`).join("")}</ol></div>`;
}
function confetti(){const e=["🎉","⭐","🟡","🟢","🔴","🔵","✨"];for(let i=0;i<28;i++){const s=document.createElement("span");s.className="conf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}}
function viewSuccess(r){
  $("#app").innerHTML=hero("Aspirasimu sudah masuk! 🙌")+`<main><div style="height:14px"></div>${ticketHTML(r)}
  ${r.pending?'<div class="panel">📡 Sinyal lagi lemah. Aspirasimu tersimpan di HP dan <b>dikirim otomatis</b> saat kamu online lagi.</div>':'<div class="panel">Terima kasih sudah ikut menentukan class meet! Screenshot tiket ini sebagai bukti ya.</div>'}</main>`;
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)confetti();window.scrollTo(0,0);
}
function viewDone(r,dup){
  $("#app").innerHTML=hero("Kamu sudah mengisi ✅")+`<main><div style="height:14px"></div>${r.list?ticketHTML(r):`<div class="ticket" id="tk"><div class="top"><small>Kode tiket</small><div class="code">${esc(r.ticket)}</div></div></div>`}<div class="panel">Satu siswa cukup mengisi satu kali. Simpan kode tiketmu sebagai bukti.${r.pending?" Jawabanmu masih menunggu sinyal untuk terkirim.":""}</div></main>`;
}

/* ===== ADMIN (#admin) ===== */
function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
async function viewAdmin(){
  $("#app").innerHTML=hero("Panel Panitia (MPK)")+`<main><div style="height:14px"></div><div class="panel"><label class="field"><span>PIN admin</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;min-height:52px"></label><button class="btn" id="go">Masuk</button><div id="ae" class="err"></div></div><div id="ad"></div></main>`;
  $("#go").onclick=()=>loadAdmin($("#pin").value);
}
let ADM=null;
async function loadAdmin(pin){
  if(API_URL.startsWith("GANTI")){$("#ae").textContent="URL server belum diisi.";return}
  $("#ae").innerHTML='<span class="spin"></span> Memuat…';
  try{
    const r=await (await fetch(API_URL+"?action=admin&pin="+encodeURIComponent(pin))).json();
    if(!r.ok){$("#ae").textContent=r.err||"Gagal.";return}
    ADM={rows:r.rows,pin};$("#ae").textContent="";renderAdmin();
  }catch(e){$("#ae").textContent=e instanceof SyntaxError?"Server tidak mengembalikan data. Pastikan deploy Apps Script: akses 'Anyone' dan URL berakhiran /exec.":"Tidak bisa terhubung. Periksa sinyal lalu coba lagi."}
}
function renderAdmin(){
  const rows=ADM.rows,N=rows.length,tsw=+lsGet("acm_total")||0;
  const cnt=LOMBA.map(()=>0);rows.forEach(r=>r.pilihan.forEach(p=>{const i=LOMBA.findIndex(l=>l[0]===p);if(i>=0)cnt[i]++}));
  const g={};rows.forEach(r=>r.tambahan.forEach(t=>{const k=key(t);if(!k)return;(g[k]=g[k]||{n:0,names:{}}).n++;g[k].names[t]=(g[k].names[t]||0)+1}));
  const ex=Object.values(g).map(o=>({name:Object.entries(o.names).sort((a,b)=>b[1]-a[1])[0][0],n:o.n})).sort((a,b)=>b.n-a.n);
  const base=LOMBA.map((l,i)=>({name:l[0],n:cnt[i],base:1})).sort((a,b)=>b.n-a.n);
  const all=[...base,...ex].sort((a,b)=>b.n-a.n);
  const mx=Math.max(1,...all.map(x=>x.n));
  const perK=KELAS.map(k=>({k,n:rows.filter(r=>r.kelas===k).length}));
  const done=perK.filter(x=>x.n).length;
  const bars=(arr,cls)=>arr.map(x=>`<div class="row"><span class="lb" title="${esc(x.name)}">${esc(x.name)}${x.base&&cls==="all"?"":""}</span><span class="tr"><i class="${x.base?"":"x"}" style="width:${x.n/mx*100}%"></i></span><span class="n">${x.n} · ${N?Math.round(x.n/N*100):0}%</span></div>`).join("");
  $("#ad").innerHTML=`
  <div class="panel"><h2 style="margin-top:0">📊 Ringkasan</h2><div class="stats"><div class="stat"><b>${N}</b>responden</div><div class="stat"><b>${tsw?Math.round(N/tsw*100)+"%":"–"}</b>dari ${tsw||"?"} siswa</div></div>
  <label class="field" style="margin-top:10px"><span>Jumlah seluruh siswa (untuk persentase)</span><input id="tsw" type="text" inputmode="numeric" value="${tsw||""}"></label>
  <p style="margin:6px 0"><b>Progres kelas:</b> ${done} dari 17 kelas sudah ada yang mengisi</p><div class="chips">${perK.map(x=>`<span class="chip ${x.n?"ok":"no"}">${x.k} · ${x.n}</span>`).join("")}</div></div>
  <div class="panel"><h2 style="margin-top:0">🏆 Peringkat 11 lomba bawaan</h2>${bars(base)}</div>
  <div class="panel"><h2 style="margin-top:0">✍️ Usulan tambahan siswa</h2>${ex.length?bars(ex.map(x=>({...x,base:0}))):"Belum ada usulan."}</div>
  <div class="panel"><h2 style="margin-top:0">🥇 Gabungan peringkat</h2><p style="margin:0 0 6px;font-size:.85rem;color:var(--mut)">Biru = lomba bawaan, hijau = usulan siswa</p>${bars(all,"all")}</div>
  <button class="btn" id="rf">Segarkan data</button><button class="btn sec" id="csv">Ekspor CSV</button>`;
  $("#tsw").onchange=e=>{lsSet("acm_total",String(parseInt(e.target.value)||0));renderAdmin()};
  $("#rf").onclick=()=>loadAdmin(ADM.pin);
  $("#csv").onclick=()=>{
    const L=[["Peringkat","Lomba","Jenis","Pendukung","Persen"]];all.forEach((x,i)=>L.push([i+1,x.name,x.base?"Bawaan":"Tambahan",x.n,N?(x.n/N*100).toFixed(1)+"%":"0%"]));
    L.push([]);L.push(["Kelas","Responden"]);perK.forEach(x=>L.push([x.k,x.n]));
    const b=new Blob(["\ufeff"+L.map(r=>r.map(csvCell).join(",")).join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rekap-aspirasi-class-meet.csv";a.click();
  };
}

/* ===== mulai ===== */
async function start(){
  if(location.hash==="#admin")return viewAdmin();
  $("#app").innerHTML=hero("Memuat…")+'<main style="text-align:center;padding:20px"><span class="spin"></span></main>';
  const d=await load("acm_done");
  if(d){try{viewDone(JSON.parse(d));flushQueue();return}catch(e){}}
  viewForm();flushQueue();
}
addEventListener("hashchange",()=>location.reload());
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
start();
</script>
